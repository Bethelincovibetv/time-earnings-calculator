<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Earnings Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0a0a0a] text-gray-300 font-sans">
    <nav class="fixed w-full z-50 p-6 flex justify-between items-center backdrop-blur-md bg-[#0a0a0a]/80 border-b border-white/5">
        <span class="text-xl font-bold text-white">TimeCalc</span>
        <div class="space-x-6">
            <button onclick="show('overview')" class="hover:text-blue-500">Overview</button>
            <button onclick="show('app')" class="hover:text-blue-500">Calculator</button>
            <button onclick="show('how-it-works')" class="hover:text-blue-500">How it Works</button>
        </div>
    </nav>

    <main class="pt-24">
        <section id="overview" class="view py-20 px-6 text-center animate-fade-in">
            <h1 class="text-5xl font-extrabold text-white mb-6">Track your <span class="text-blue-500">value</span></h1>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto">Professional real-time earnings tracking for freelancers.</p>
        </section>

        <section id="app" class="view hidden py-20 px-6 flex justify-center">
            <div class="w-full max-w-md bg-[#161616] p-8 rounded-3xl border border-white/10 shadow-2xl">
                <select id="currency" class="w-full bg-[#0a0a0a] border border-white/10 rounded-xl p-3 mb-4 text-white">
                    <option value="$">USD ($)</option>
                    <option value="€">EUR (€)</option>
                    <option value="£">GBP (£)</option>
                    <option value="₦">NGN (₦)</option>
                </select>
                <input type="number" id="hourly-rate" placeholder="Hourly Rate" class="w-full bg-[#0a0a0a] border border-white/10 rounded-xl p-3 mb-6 text-white">
                <div class="text-center mb-8">
                    <div id="total-earnings" class="text-5xl font-black text-blue-500">$0.00</div>
                    <div id="timer-display" class="text-gray-500 font-mono">00:00:00</div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button id="toggle-btn" class="bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-white">Start</button>
                    <button id="reset-btn" class="bg-white/5 hover:bg-white/10 py-3 rounded-xl font-bold text-white">Reset</button>
                </div>
            </div>
        </section>

        <section id="how-it-works" class="view hidden py-20 px-6 text-center">
            <h2 class="text-3xl font-bold text-white">Precision Tracking</h2>
            <p class="mt-4 text-gray-400">Simply set your rate and start the timer.</p>
        </section>
    </main>

    <footer class="py-10 text-center border-t border-white/10 text-sm">
        <a href="https://time-earnings-calculator.vercel.app" class="text-blue-500 hover:underline">&copy; 2026 Time Earnings Calculator</a>
    </footer>
    <script src="app.js"></script>
</body>
</html>
