<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Earnings Tracker</title><link rel="stylesheet" href="styles.css"></head><body><div class="container"><header><h1>Earnings Tracker</h1><p>Track your session value in real-time.</p></header><main><div class="input-group"><label for="hourly-rate">Hourly Rate ($)</label><input type="number" id="hourly-rate" value="50" placeholder="Enter rate..."></div><div class="display-card"><div class="earnings-value" id="total-earnings">$0.00</div><div class="time-elapsed" id="time-elapsed">00:00:00</div></div><div class="controls"><button id="toggle-btn" class="btn-primary">Start</button><button id="reset-btn" class="btn-secondary">Reset</button></div></main></div><script src="app.js"></script></body></html>
