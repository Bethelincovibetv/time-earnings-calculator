<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Earnings Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#121212] text-gray-200 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-sm bg-[#1e1e1e] rounded-3xl border border-gray-800 p-8 shadow-2xl">
        <h1 class="text-xl font-bold mb-6 text-center text-white">Earnings Tracker</h1>
        
        <div class="space-y-4 mb-8">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Currency</label>
                <select id="currency" class="w-full bg-[#121212] border border-gray-700 rounded-xl p-3 outline-none focus:border-blue-500 transition">
                    <option value="$">USD ($)</option>
                    <option value="€">EUR (€)</option>
                    <option value="£">GBP (£)</option>
                    <option value="₦">NGN (₦)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Hourly Rate</label>
                <input type="number" id="hourly-rate" value="50" class="w-full bg-[#121212] border border-gray-700 rounded-xl p-3 outline-none focus:border-blue-500 transition">
            </div>
        </div>

        <div class="text-center mb-8">
            <div id="total-earnings" class="text-5xl font-extrabold text-blue-500 mb-2">$0.00</div>
            <div id="time-elapsed" class="text-lg text-gray-400 font-mono">00:00:00</div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button id="toggle-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">Start</button>
            <button id="reset-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl transition">Reset</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
